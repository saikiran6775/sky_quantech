<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 720" width="1680" height="720" role="img" aria-labelledby="ohe-title ohe-desc">
<title id="ohe-title">AI-powered overhead equipment inspection workflow</title>
<desc id="ohe-desc">An inspection drone captures imagery of railway overhead catenary equipment. Computer vision marks components inside the captured frame, and the result is recorded as an inspection finding with image evidence and location data.</desc>

<!--
  SKY QUANTECH Vector Art System, master illustration 01: OHE inspection.
  Narrative reads left to right: drone, capture, detection, analysis, record.
  Reusable primitives live in defs so later illustrations (rolling stock,
  power grid, asset management) share this vocabulary instead of inventing a
  second style. Each stage carries an id so it can be animated later.

  The workflow rail sits at the top rather than the foot of the frame: the
  Case Studies hero paints a caption over the lower third, which would bury it.
-->

<defs>
  <style>
    .ink      { stroke: #7C99CE; }   /* structure line work      */
    .ink-soft { stroke: #3F5CA8; }   /* recessive structure      */
    .live     { stroke: #0078FF; }   /* detection, active state  */
    .flow     { stroke: #0050F0; }   /* data movement            */
    .lbl      { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #8FC2FF; letter-spacing: 1.5px; }
    .lbl-dim  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #6483C4; letter-spacing: 1.5px; }
    .lbl-key  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #FFFFFF; letter-spacing: 1.5px; }
    .panel    { fill: #001070; stroke: #27459F; }
    .nf       { fill: none; }
  </style>

  <pattern id="p-grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M60 0H0v60" class="nf" stroke="#0B2280" stroke-width="1"/>
  </pattern>

  <linearGradient id="p-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#001C82"/>
    <stop offset="1" stop-color="#000A40"/>
  </linearGradient>

  <radialGradient id="p-focus" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#0034C8" stop-opacity=".55"/>
    <stop offset="1" stop-color="#0034C8" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="p-beam" x1="0" y1="0" x2=".7" y2="1">
    <stop offset="0" stop-color="#0078FF" stop-opacity=".30"/>
    <stop offset="1" stop-color="#0078FF" stop-opacity="0"/>
  </linearGradient>

  <marker id="p-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M1 1 11 6 1 11Z" fill="#0050F0"/>
  </marker>

  <!-- Corner-bracket marker: base shape for every capture frame. -->
  <symbol id="p-corner" viewBox="0 0 100 100" preserveAspectRatio="none">
    <path d="M0 20V0h20M80 0h20v20M100 80v20H80M20 100H0V80" class="nf live" stroke-width="4" vector-effect="non-scaling-stroke"/>
  </symbol>

  <!-- Asset marker: pins a physical component. -->
  <g id="p-asset">
    <circle r="14" class="nf live" stroke-width="2"/>
    <circle r="4" fill="#0078FF"/>
  </g>

  <!-- Location marker. -->
  <g id="p-gps">
    <path d="M0-15a10.5 10.5 0 0 1 10.5 10.5C10.5 3 0 15 0 15S-10.5 3-10.5-4.5A10.5 10.5 0 0 1 0-15Z" class="nf live" stroke-width="2"/>
    <circle cy="-4.5" r="3.4" fill="#0078FF"/>
  </g>

  <!-- OHE cantilever mast. Base sits at local origin; the contact wire
       meets the registration arm at local y = -232. -->
  <g id="p-mast">
    <path d="M0 0V-370" class="ink" stroke-width="8" stroke-linecap="round"/>
    <path d="M-22 0h44" class="ink" stroke-width="6" stroke-linecap="round"/>
    <path d="M-14-14h28" class="ink-soft" stroke-width="4"/>
    <path d="M0-330 152-292" class="ink" stroke-width="5"/>
    <path d="M0-252 152-292" class="ink" stroke-width="4"/>
    <path d="M0-330 0-252" class="ink-soft" stroke-width="3"/>
    <g class="ink-soft" stroke-width="3">
      <path d="M-14-96h28M-14-176h28M-14-256h28"/>
    </g>
    <path d="M152-292V-266" class="ink" stroke-width="4"/>
    <g stroke="#A8BEE8" stroke-width="3" class="nf">
      <path d="M143-262h18M143-254h18M143-246h18"/>
    </g>
    <path d="M152-242V-232" class="ink" stroke-width="4"/>
    <path d="M134-232h36" class="ink" stroke-width="5" stroke-linecap="round"/>
  </g>
</defs>

<!-- ===== scene ===== -->
<rect width="1680" height="720" fill="url(#p-sky)"/>
<rect width="1680" height="720" fill="url(#p-grid)"/>
<ellipse cx="770" cy="390" rx="620" ry="330" fill="url(#p-focus)"/>

<!-- ===== workflow rail ===== -->
<g id="ohe-workflow" transform="translate(0 62)">
  <path d="M262 0h1156" stroke="#1D3894" stroke-width="2"/>
  <g>
    <g transform="translate(262 0)"><circle r="7" fill="#0078FF"/><text class="lbl-key" y="-22" font-size="20" text-anchor="middle">CAPTURE</text></g>
    <g transform="translate(647 0)"><circle r="7" fill="#0078FF"/><text class="lbl" y="-22" font-size="20" text-anchor="middle">DETECT</text></g>
    <g transform="translate(1033 0)"><circle r="7" fill="#0078FF"/><text class="lbl" y="-22" font-size="20" text-anchor="middle">ANALYZE</text></g>
    <g transform="translate(1418 0)"><circle r="7" fill="#0078FF"/><text class="lbl" y="-22" font-size="20" text-anchor="middle">RECORD</text></g>
  </g>
</g>

<!-- ===== 1. physical infrastructure ===== -->
<g id="ohe-infrastructure">
  <g id="ohe-track" stroke-linecap="round">
    <path d="M150 690 1560 604" class="ink-soft" stroke-width="5"/>
    <path d="M186 726 1560 630" class="ink-soft" stroke-width="5"/>
    <g class="ink-soft" stroke-width="3" opacity=".65">
      <path d="M250 714 226 688"/><path d="M420 703 400 677"/><path d="M590 692 574 666"/>
      <path d="M760 681 748 655"/><path d="M930 670 922 644"/><path d="M1100 659 1096 633"/>
      <path d="M1270 648 1268 622"/><path d="M1440 637 1440 611"/>
    </g>
  </g>

  <!-- catenary and contact wires, with droppers between -->
  <g id="ohe-wires" class="nf">
    <path d="M150 286 1560 330" class="ink-soft" stroke-width="3"/>
    <path d="M150 372 1560 404" class="ink" stroke-width="4"/>
    <g class="ink-soft" stroke-width="2.5" opacity=".75">
      <path d="M310 291v80"/><path d="M470 296v79"/><path d="M630 301v78"/>
      <path d="M950 311v77"/><path d="M1110 316v76"/><path d="M1270 321v75"/><path d="M1430 326v74"/>
    </g>
  </g>

  <!-- receding mast, held back so the near mast reads as the subject -->
  <g transform="translate(1180 636) scale(.5)" opacity=".34"><use href="#p-mast"/></g>

  <!-- inspection subject -->
  <g id="ohe-mast-primary" transform="translate(600 640) scale(1.12)"><use href="#p-mast"/></g>
</g>

<!-- ===== 2. capture ===== -->
<path id="ohe-beam" d="M512 202 660 250 706 476Z" fill="url(#p-beam)"/>

<g id="ohe-drone" transform="translate(486 176)">
  <path d="M-56-18 56-18" class="ink" stroke-width="5" stroke-linecap="round"/>
  <rect x="-32" y="-16" width="64" height="28" rx="8" class="nf ink" stroke-width="4"/>
  <path d="M-56-18v-14M56-18v-14" class="ink" stroke-width="4" stroke-linecap="round"/>
  <g class="ink-soft" stroke-width="3"><path d="M-80-32h48M32-32h48"/></g>
  <circle cy="16" r="10" class="nf live" stroke-width="3"/>
  <circle cy="16" r="3.5" fill="#0078FF"/>
  <path d="M-24 22v10M24 22v10" class="ink-soft" stroke-width="3"/>
  <text class="lbl" y="-56" font-size="21" text-anchor="middle">INSPECTION DRONE</text>
</g>

<!-- captured frame around the component cluster -->
<g id="ohe-capture-frame">
  <rect x="646" y="252" width="286" height="228" rx="4" fill="#0078FF" opacity=".05"/>
  <use href="#p-corner" x="646" y="252" width="286" height="228"/>
  <text class="lbl-key" x="646" y="236" font-size="21">IMAGE CAPTURE</text>
</g>

<!-- ===== 3. detection ===== -->
<g id="ohe-detections">
  <rect x="742" y="316" width="74" height="86" rx="3" class="nf live" stroke-width="2.5" stroke-dasharray="7 5"/>
  <rect x="662" y="268" width="150" height="34" rx="3" class="nf live" stroke-width="2" opacity=".5"/>
  <rect x="664" y="392" width="150" height="40" rx="3" class="nf live" stroke-width="2" opacity=".5"/>
  <text class="lbl-dim" x="664" y="456" font-size="18">CONTACT WIRE</text>
  <use href="#p-asset" x="779" y="362"/>
</g>

<!-- Zoom card: the same detection at a size the component can be read at.
     The two rules tie it back to the captured frame. -->
<g id="ohe-detail">
  <path d="M646 252 500 300M646 480 500 480" class="nf" stroke="#2A4AA8" stroke-width="1.5" stroke-dasharray="6 6"/>
  <rect x="200" y="300" width="300" height="180" rx="6" class="panel" stroke-width="2"/>
  <text class="lbl-dim" x="220" y="330" font-size="16">DETECTED COMPONENT</text>

  <g transform="translate(392 456) scale(2)">
    <path d="M0 0V-58" class="ink" stroke-width="4" stroke-linecap="round"/>
    <path d="M0-54 44-42" class="ink" stroke-width="3"/>
    <path d="M0-34 44-42" class="ink" stroke-width="2.5"/>
    <path d="M44-42V-32" class="ink" stroke-width="2.5"/>
    <g stroke="#A8BEE8" stroke-width="2" class="nf">
      <path d="M38-30h12M38-25h12M38-20h12"/>
    </g>
    <path d="M44-16V-9" class="ink" stroke-width="2.5"/>
    <path d="M32-9h24" class="ink" stroke-width="3" stroke-linecap="round"/>
  </g>

  <rect x="436" y="356" width="56" height="86" rx="3" class="nf live" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="lbl" x="220" y="392" font-size="17">OHE COMPONENT</text>
  <text class="lbl-dim" x="220" y="416" font-size="16">VISUAL RECORD</text>
</g>

<!-- callout from the detected component -->
<g id="ohe-callout">
  <path d="M816 360 900 360 936 330" class="nf flow" stroke-width="2"/>
  <circle cx="816" cy="360" r="4" fill="#0050F0"/>
  <text class="lbl-key" x="948" y="324" font-size="21">COMPONENT IDENTIFIED</text>
  <text class="lbl-dim" x="948" y="350" font-size="18">VISUAL ANALYSIS</text>
</g>

<!-- ===== 4. analysis ===== -->
<g id="ohe-dataflow">
  <path d="M932 288 1010 288 1010 238 1052 238" class="nf flow" stroke-width="2.5" stroke-dasharray="10 8" marker-end="url(#p-arrow)"/>
  <path d="M1188 238 1236 238" class="nf flow" stroke-width="2.5" stroke-dasharray="10 8" marker-end="url(#p-arrow)"/>
</g>

<g id="ohe-ai-node" transform="translate(1122 238)">
  <path d="M-66-42 44-42 66-20 66 20 44 42-66 42Z" class="panel" stroke-width="2"/>
  <g class="nf live" stroke-width="2.5">
    <circle r="16"/>
    <path d="M-16 0h-18M16 0h18M0-16v-16M0 16v16"/>
  </g>
  <text class="lbl-dim" y="70" font-size="18" text-anchor="middle">AI ANALYSIS</text>
</g>

<!-- ===== 5. finding and evidence ===== -->
<g id="ohe-finding-panel" transform="translate(1252 166)">
  <rect width="240" height="296" rx="8" class="panel" stroke-width="2"/>
  <path d="M0 48h240" stroke="#27459F" stroke-width="2"/>
  <text class="lbl-key" x="20" y="31" font-size="19">INSPECTION FINDING</text>

  <g transform="translate(20 70)">
    <rect width="200" height="88" rx="3" fill="#00135E" stroke="#27459F" stroke-width="1.5"/>
    <path d="M20 72 62 36 90 60 118 32 180 72Z" fill="#0B2C92"/>
    <use href="#p-corner" width="200" height="88"/>
  </g>
  <text class="lbl-dim" x="20" y="186" font-size="17">IMAGE EVIDENCE</text>

  <g transform="translate(0 204)">
    <path d="M20 0h200" stroke="#27459F" stroke-width="1.5"/>
    <g transform="translate(34 38)"><use href="#p-gps"/></g>
    <text class="lbl-dim" x="60" y="32" font-size="17">LOCATION DATA</text>
    <text class="lbl" x="60" y="54" font-size="17">DATA</text>
  </g>

  <g transform="translate(0 262)">
    <path d="M20 0h200" stroke="#27459F" stroke-width="1.5"/>
    <text class="lbl-dim" x="20" y="26" font-size="17">DIGITAL RECORD</text>
    <circle cx="210" cy="19" r="6" fill="#0078FF"/>
  </g>
</g>
</svg>
